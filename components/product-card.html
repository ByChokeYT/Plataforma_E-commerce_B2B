<!-- ══════════════════════════════════════════════════════
     components/product-card.html — Plantilla de tarjeta
     NOTA: Este archivo es una referencia visual/documental.
     En la SPA, las tarjetas se generan en renderCatalog()
     dentro de app.js usando template literals.
     ══════════════════════════════════════════════════════ -->

<div class="bg-white rounded-2xl p-4 border border-slate-200/50 shadow-sm hover:shadow-md
            transition-all duration-300 group flex flex-col h-full">

    <!-- Imagen del producto -->
    <div class="aspect-square relative overflow-hidden rounded-xl bg-slate-100 mb-4">
        <img
            src="/assets/img/product-placeholder.jpg"
            alt="Nombre del Producto"
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
        >
        <!-- Badge de stock -->
        <div class="absolute top-2 left-2 px-2 py-0.5 bg-white/90 backdrop-blur rounded-md
                    text-[9px] font-bold text-slate-800 border border-slate-200 shadow-sm">
            Stock: 120
        </div>
        <!-- Badge de Tier activo -->
        <div class="absolute top-2 right-2 px-2 py-0.5 bg-blue-600 text-white rounded-md
                    text-[9px] font-bold shadow-sm">
            Tier: 1
        </div>
    </div>

    <!-- Info del producto -->
    <div class="flex-1 flex flex-col px-1">
        <span class="text-[9px] font-bold text-blue-600 uppercase tracking-wide mb-1">Categoría</span>
        <h3 class="font-bold text-sm text-slate-900 mb-3 line-clamp-2 leading-snug">
            Nombre del Producto Industrial
        </h3>

        <!-- Precios y CTA -->
        <div class="mt-auto">
            <div class="flex items-baseline gap-2 mb-4">
                <span class="text-lg font-bold text-slate-900">Bs. 405.00</span>
                <span class="text-[10px] text-slate-400 line-through">Bs. 450.00</span>
                <span class="text-[9px] font-bold text-emerald-600 ml-auto">-10%</span>
            </div>
            <button class="w-full py-2.5 bg-blue-600 text-white rounded-lg text-xs font-bold
                           hover:bg-blue-700 active:scale-[0.98] transition-all shadow-sm shadow-blue-500/10">
                Añadir al Pedido
            </button>
        </div>
    </div>
</div>
