<!-- Encabezado Dinámico B2B Core -->
<header class="flex flex-col md:flex-row justify-between items-start md:items-end mb-16 gap-8 relative z-10">
    <div class="flex items-center gap-4 animate-enter-up">
        <button id="mobile-menu-btn" onclick="toggleSidebar()" class="lg:hidden p-3 bg-white border border-slate-200 rounded-2xl text-slate-600 hover:bg-slate-50 transition-all shadow-sm">
            <i data-lucide="menu" size="20"></i>
        </button>
        <div>
            <h1 class="text-3xl md:text-4xl font-black text-slate-900 tracking-tighter" id="view-title">Catálogo</h1>
            <p class="text-slate-400 text-xs md:text-sm font-bold mt-1 max-w-md" id="view-subtitle">Gestión de suministros industriales con tarifas corporativas.</p>
        </div>
    </div>
    <div id="search-container" class="flex flex-col md:flex-row items-center gap-4 animate-enter-up w-full md:w-auto">
        <div class="relative group w-full md:w-80">
            <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-blue-500 transition-colors" size="18"></i>
            <input type="text" id="search-input" placeholder="Buscar por SKU o Categoría" class="pl-14 pr-6 py-4 bg-white border border-slate-100 rounded-2xl w-full shadow-sm focus:outline-none focus:ring-[12px] focus:ring-blue-500/5 focus:border-blue-500/30 transition-all text-sm font-medium placeholder:text-slate-300">
        </div>
        <button onclick="openModal('bulk-import')" class="flex items-center gap-3 px-6 py-4 bg-slate-900 text-white rounded-2xl text-xs font-black uppercase tracking-widest hover:bg-blue-600 transition-all shadow-xl shadow-slate-900/10 hover:shadow-blue-500/20 whitespace-nowrap">
            <i data-lucide="box" size="16"></i> Carga Masiva
        </button>
    </div>
</header>
