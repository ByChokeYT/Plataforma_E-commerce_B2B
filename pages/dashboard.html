<!-- ══════════════════════════════════════════════════════
     pages/dashboard.html — Vista: Panel de Control B2B
     Cargado por router.js en navigate('dashboard')
     Inyectado en: #page-slot (index.html)
     ══════════════════════════════════════════════════════ -->

<!-- ─── Bento Grid de KPIs ─── -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-8" id="stats-bento">
    <!-- Populated by renderDashboard() in app.js -->
</div>

<!-- ─── Gráfico + Órdenes Recientes & Crédito Gauge ─── -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- Columna Izquierda: Gráfico de consumo mensual (Figma Line/Area Chart) -->
    <div class="lg:col-span-2 bg-white rounded-3xl border border-slate-200/60 shadow-sm p-8 flex flex-col card-apple">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h3 class="font-bold text-slate-900 text-sm">Consumo Mensual</h3>
                <p class="text-[10px] text-slate-400 mt-0.5 font-medium uppercase tracking-widest">
                    en miles USD
                </p>
            </div>
            <span class="text-[9px] bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-full font-bold uppercase tracking-widest">
                2025
            </span>
        </div>
        <!-- Contenedor del gráfico — generado por renderChart() -->
        <div class="flex-1 flex items-end h-48 relative" id="revenue-chart">
            <!-- Populated by renderChart() in app.js -->
        </div>
    </div>

    <!-- Columna Derecha: Widgets apilados -->
    <div class="flex flex-col gap-6">
        
        <!-- Widget 1: Indicador Radial de Crédito Corporativo -->
        <div class="bg-white rounded-3xl border border-slate-200/60 shadow-sm p-6 flex flex-col items-center justify-center text-center relative overflow-hidden card-apple">
            <div class="flex justify-between items-center w-full mb-4">
                <h3 class="font-bold text-slate-900 text-xs">Análisis de Crédito</h3>
                <span class="text-[9px] font-black text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-950 px-2 py-0.5 rounded-md uppercase tracking-wider">Línea activa</span>
            </div>
            
            <div class="relative w-32 h-32 flex items-center justify-center my-2">
                <!-- SVG Anillo de Progreso -->
                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                    <!-- Círculo de fondo -->
                    <circle cx="50" cy="50" r="40" stroke="var(--border)" stroke-width="8" fill="transparent" />
                    <!-- Círculo de progreso -->
                    <circle id="credit-gauge-circle" cx="50" cy="50" r="40" stroke="var(--primary)" stroke-width="8" fill="transparent"
                        stroke-dasharray="251.2" stroke-dashoffset="251.2" stroke-linecap="round" 
                        class="transition-all duration-1000 ease-out" />
                </svg>
                <!-- Texto Central -->
                <div class="absolute flex flex-col items-center justify-center">
                    <span class="text-2xl font-black text-slate-900" id="credit-gauge-percent">0%</span>
                    <span class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">Usado</span>
                </div>
            </div>
            
            <div class="w-full flex justify-between text-[11px] font-bold border-t border-slate-50 dark:border-slate-800 pt-4 mt-2">
                <div class="text-left">
                    <p class="text-[8px] text-slate-400 font-black uppercase tracking-wider mb-0.5">Consumido</p>
                    <p class="font-mono text-slate-900" id="credit-gauge-used">Bs. 0</p>
                </div>
                <div class="text-right">
                    <p class="text-[8px] text-slate-400 font-black uppercase tracking-wider mb-0.5">Disponible</p>
                    <p class="font-mono text-emerald-500" id="credit-gauge-available">Bs. 0</p>
                </div>
            </div>
        </div>

        <!-- Widget 2: Órdenes Recientes -->
        <div class="bg-white rounded-3xl border border-slate-200/60 shadow-sm overflow-hidden flex flex-col card-apple p-0">
            <div class="px-6 py-5 border-b border-slate-50 dark:border-slate-800 flex justify-between items-center flex-shrink-0">
                <h3 class="font-bold text-slate-900 text-xs">Órdenes Recientes</h3>
                <button onclick="navigate('orders-full')"
                    class="text-[10px] font-bold text-blue-600 hover:text-blue-700 transition-colors flex items-center gap-1">
                    Ver todas <i data-lucide="arrow-right" size="10"></i>
                </button>
            </div>
            <div class="overflow-x-auto flex-1">
                <table class="w-full text-left text-xs">
                    <tbody id="orders-mini-table" class="divide-y divide-slate-50 dark:divide-slate-800">
                        <!-- Populated by renderDashboard() in app.js -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</div>
