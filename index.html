<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Core | Plataforma de Suministros Industriales</title>
    <meta name="description" content="Portal corporativo B2B para pedidos al por mayor con precios dinámicos, gestión de crédito y dashboard estratégico.">
    <meta name="robots" content="noindex">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- ——— Design System CSS ——— -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

<div id="view-login" class="fixed inset-0 z-[200] flex items-center justify-center overflow-hidden" style="background: radial-gradient(circle at center, #131a26 0%, #080b12 100%) !important;">
    <!-- Auras ambientales animadas de fondo -->
    <div class="glow-orb w-[350px] h-[350px] bg-blue-500/15 -top-20 -left-20"></div>
    <div class="glow-orb w-[450px] h-[450px] bg-indigo-500/10 -bottom-32 -right-32 animate-mesh"></div>
    <div class="glow-orb w-[300px] h-[300px] bg-purple-500/10 top-[25%] right-[10%]"></div>
 
    <div class="glass-login w-full max-w-[400px] p-10 rounded-3xl relative z-10 mx-4 animate-enter-up border border-white/10 shadow-2xl backdrop-blur-3xl overflow-hidden">
 
        <div class="relative z-10 text-center">
            <!-- Isotipo Moderno con Anillo de Pulso Sutil -->
            <div class="relative w-16 h-16 mx-auto mb-6 flex items-center justify-center">
                <div class="absolute inset-0 bg-blue-500/10 rounded-2xl animate-pulse"></div>
                <div class="w-12 h-12 bg-slate-900 border border-white/10 rounded-xl flex items-center justify-center shadow-lg">
                    <i data-lucide="shield-check" class="text-blue-500" size="24"></i>
                </div>
            </div>
            
            <h2 class="text-3xl font-black text-white tracking-tighter mb-1">B2B Core</h2>
            <p class="text-[9px] text-slate-400 font-bold uppercase tracking-[0.25em] mb-8">Portal de Abastecimiento B2B</p>
 
            <div class="space-y-4 text-left">
                <div class="space-y-1.5">
                    <label class="text-[9px] font-bold text-slate-400 uppercase ml-1 tracking-widest">Identificador Corporativo</label>
                    <div class="relative group">
                        <i data-lucide="building-2" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-blue-500 transition-colors" size="16"></i>
                        <input type="text" id="login-user" placeholder="C-9901" 
                            class="w-full pl-12 pr-5 py-3 bg-white/5 border border-white/10 rounded-xl focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500/50 outline-none transition-all text-xs font-bold text-white placeholder:text-slate-600">
                    </div>
                </div>
                
                <div class="space-y-1.5">
                    <label class="text-[9px] font-bold text-slate-400 uppercase ml-1 tracking-widest">Código de Seguridad</label>
                    <div class="relative group">
                        <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-blue-500 transition-colors" size="16"></i>
                        <input type="password" id="login-pass" placeholder="••••••••" 
                            class="w-full pl-12 pr-5 py-3 bg-white/5 border border-white/10 rounded-xl focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500/50 outline-none transition-all text-xs font-bold text-white placeholder:text-slate-600">
                    </div>
                </div>
            </div>
 
            <button onclick="handleLogin()" 
                class="btn-premium w-full py-3.5 rounded-xl font-bold text-xs uppercase tracking-widest active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-8 cursor-pointer">
                Acceso Corporativo
                <i data-lucide="arrow-right" size="14"></i>
            </button>
 
            <div class="mt-8 pt-6 border-t border-white/5 flex flex-col gap-3">
                <p class="text-[8px] text-slate-500 font-bold uppercase text-center tracking-widest">Acceso Rápido Demo</p>
                <div class="flex flex-col sm:flex-row gap-2">
                    <button onclick="document.getElementById('login-user').value='C-9901'; showToast('Distribuidor (C-9901) seleccionado', 'success')" 
                        class="flex-1 px-3 py-2 bg-white/5 hover:bg-white/10 active:scale-95 rounded-xl border border-white/5 text-[9px] font-semibold text-slate-300 hover:text-white transition-all cursor-pointer flex items-center justify-center gap-1.5">
                        <i data-lucide="user" size="10"></i> C-9901 (Dist.)
                    </button>
                    <button onclick="document.getElementById('login-user').value='C-8842'; showToast('Partner Premium (C-8842) seleccionado', 'success')" 
                        class="flex-1 px-3 py-2 bg-white/5 hover:bg-white/10 active:scale-95 rounded-xl border border-white/5 text-[9px] font-semibold text-slate-300 hover:text-white transition-all cursor-pointer flex items-center justify-center gap-1.5">
                        <i data-lucide="user-check" size="10"></i> C-8842 (Prem.)
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="app-shell" class="hidden min-h-screen flex flex-col lg:flex-row bg-slate-50 overflow-hidden relative">
    <!-- Glows ambientales de fondo -->
    <div class="glow-orb w-[500px] h-[500px] bg-blue-500/5 -top-40 -left-40"></div>
    <div class="glow-orb w-[600px] h-[600px] bg-indigo-500/5 bottom-10 right-10 animate-mesh"></div>
    <div class="glow-orb w-[400px] h-[400px] bg-purple-500/5 top-[40%] left-[30%]"></div>
    <!-- Overlay para móvil -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
    
    <div id="sidebar-slot"></div>
    
    <main class="flex-1 min-h-screen transition-all duration-500" id="main-content">
        <div class="p-4 pb-24 md:p-8 lg:p-12 max-w-7xl mx-auto">
            <div id="header-slot"></div>
            <div id="page-slot" class="animate-enter-up"></div>
        </div>
    </main>

</div>

<!-- Modales Globales -->
<div id="modal-invoice" class="modal fixed inset-0 z-[110] flex items-center justify-center hidden">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeModal('invoice')"></div>
    <div class="bg-white w-full max-w-2xl mx-4 rounded-3xl shadow-2xl relative z-10 overflow-hidden animate-scale-in">
        <div id="invoice-content" class="p-12"></div>
        <div class="px-12 py-6 bg-slate-50 border-t border-slate-100 flex justify-end gap-4">
            <button onclick="closeModal('invoice')" class="px-6 py-2.5 text-xs font-bold text-slate-500 hover:text-slate-900 transition-colors">Cerrar</button>
            <button onclick="window.print()" class="px-6 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-bold hover:bg-blue-700 transition-all flex items-center gap-2">
                <i data-lucide="printer" size="14"></i> Imprimir Factura
            </button>
        </div>
    </div>
</div>

<div id="modal-tracking" class="modal fixed inset-0 z-[110] flex items-center justify-center hidden">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeModal('tracking')"></div>
    <div class="bg-white w-full max-w-lg mx-4 rounded-3xl shadow-2xl relative z-10 overflow-hidden animate-scale-in">
        <div class="p-8">
            <div class="flex justify-between items-start mb-8">
                <div>
                    <h3 class="text-lg font-bold text-slate-900" id="tracking-order-id">Rastreo de Orden</h3>
                    <p class="text-xs text-slate-400 mt-0.5" id="tracking-order-date"></p>
                </div>
                <button onclick="closeModal('tracking')" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center hover:bg-slate-200 transition-colors">
                    <i data-lucide="x" size="14"></i>
                </button>
            </div>
            <div id="tracking-timeline" class="relative"></div>
            <div class="mt-8 bg-slate-50 rounded-2xl p-5 flex items-center gap-4">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center flex-shrink-0">
                    <i data-lucide="truck" class="text-white" size="18"></i>
                </div>
                <div>
                    <p class="text-xs font-bold text-slate-900">Transportista: DHL Express Industrial</p>
                    <p class="text-[10px] text-slate-400 mt-0.5">Guía: <span class="font-mono font-bold text-blue-600" id="tracking-guide">—</span></p>
                </div>
            </div>
        </div>
        <div class="px-8 py-5 bg-slate-50 border-t border-slate-100 flex justify-end">
            <button onclick="closeModal('tracking')" class="px-6 py-2.5 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-slate-800 transition-all">Cerrar</button>
        </div>
    </div>
</div>

<div id="modal-bulk-import" class="modal fixed inset-0 z-[110] flex items-center justify-center hidden">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeModal('bulk-import')"></div>
    <div class="bg-white w-full max-w-md mx-4 rounded-3xl shadow-2xl relative z-10 overflow-hidden animate-scale-in">
        <div class="p-8">
            <h3 class="text-lg font-bold text-slate-900 mb-1">Carga Masiva de SKUs</h3>
            <p class="text-xs text-slate-400 mb-6">Pega los IDs y cantidades separados por coma.</p>
            <textarea id="bulk-input" placeholder="ID, CANTIDAD" class="w-full h-48 p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-mono focus:outline-none focus:ring-4 focus:ring-blue-500/5 focus:border-blue-500 transition-all mb-6 resize-none"></textarea>
            <div class="flex gap-3">
                <button onclick="handleBulkImport()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-all text-xs">Añadir al Carrito</button>
                <button onclick="closeModal('bulk-import')" class="px-6 py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 transition-all text-xs">Cancelar</button>
            </div>
        </div>
    </div>
</div>

<div id="modal-product-qty" class="modal fixed inset-0 z-[110] flex items-center justify-center hidden">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeModal('product-qty')"></div>
    <div class="bg-white dark:bg-slate-900 w-full max-w-md mx-4 rounded-3xl shadow-2xl relative z-10 overflow-hidden animate-scale-in border border-slate-100 dark:border-slate-800">
        <div class="p-8">
            <div class="flex justify-between items-start mb-6">
                <h3 class="text-lg font-bold text-slate-900 dark:text-white">Detalle de Compra B2B</h3>
                <button onclick="closeModal('product-qty')" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                    <i data-lucide="x" size="14" class="text-slate-500 dark:text-slate-400"></i>
                </button>
            </div>
            
            <!-- Detalle del Producto en el Modal -->
            <div class="flex items-center gap-4 mb-6 p-4 bg-slate-50 dark:bg-slate-850 rounded-2xl border border-slate-100 dark:border-slate-800">
                <div class="w-16 h-16 rounded-xl bg-slate-100 dark:bg-slate-900 overflow-hidden flex-shrink-0 border border-slate-200/50 dark:border-slate-700/50">
                    <img id="modal-prod-img" class="w-full h-full object-cover" src="" alt="" onerror="this.src='https://images.unsplash.com/photo-1518770660439-4636190af475?w=100&h=100&fit=crop'">
                </div>
                <div class="min-w-0 flex-1">
                    <span id="modal-prod-category" class="text-[9px] font-black text-blue-600 dark:text-blue-400 uppercase tracking-widest bg-blue-50 dark:bg-blue-950 px-2 py-0.5 rounded-md"></span>
                    <h4 id="modal-prod-name" class="font-bold text-slate-900 dark:text-white text-sm leading-snug mt-2 truncate"></h4>
                    <p id="modal-prod-stock-info" class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mt-1"></p>
                </div>
            </div>
            
            <!-- Escala de Precios B2B -->
            <div id="modal-prod-tiers-container" class="mb-6">
                <!-- Se rellena dinámicamente -->
            </div>
            
            <!-- Selector de Cantidad e Info Dinámica -->
            <div class="space-y-4 mb-6 p-5 bg-slate-50 dark:bg-slate-850 rounded-2xl border border-slate-100 dark:border-slate-800">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-black text-slate-500 dark:text-slate-450 uppercase tracking-wider">Cantidad Solicitada:</span>
                    <div class="flex items-center bg-white dark:bg-slate-800 rounded-xl p-1 border border-slate-150 dark:border-slate-700">
                        <button onclick="adjustModalQty(-1)" class="w-8 h-8 flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-all active:scale-90 cursor-pointer">
                            <i data-lucide="minus" size="14" class="text-slate-700 dark:text-slate-300"></i>
                        </button>
                        <input type="number" id="modal-prod-qty-input" value="1" min="1" class="w-16 text-center font-bold text-sm bg-transparent border-none focus:ring-0 focus:outline-none dark:text-white" oninput="updateModalTotals()" style="border: none !important; box-shadow: none !important; background-color: transparent !important;">
                        <button onclick="adjustModalQty(1)" class="w-8 h-8 flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-all active:scale-90 cursor-pointer">
                            <i data-lucide="plus" size="14" class="text-slate-700 dark:text-slate-300"></i>
                        </button>
                    </div>
                </div>
                
                <div class="flex items-center justify-between text-xs font-bold text-slate-500 dark:text-slate-450 pt-2">
                    <span>Precio Unitario (con desc.):</span>
                    <span id="modal-prod-unit-price" class="font-mono text-slate-900 dark:text-white font-bold">Bs. 0.00</span>
                </div>
                
                <div class="flex items-center justify-between pt-4 border-t border-slate-200 dark:border-slate-700">
                    <span class="text-xs font-black text-slate-900 dark:text-white uppercase tracking-wider">Subtotal B2B:</span>
                    <span id="modal-prod-subtotal" class="text-xl font-black text-blue-600 dark:text-blue-400 font-mono">Bs. 0.00</span>
                </div>
                
                <!-- Banner de Ahorro B2B Activo -->
                <div id="modal-prod-saving-alert" class="hidden text-[10px] font-bold text-emerald-500 bg-emerald-50 dark:bg-emerald-950/30 px-3 py-2 rounded-xl text-center mt-3 animate-fade-in border border-emerald-100 dark:border-emerald-900/50 flex items-center justify-center gap-1.5">
                    <!-- Rellenado dinámicamente -->
                </div>
            </div>
            
            <div class="flex gap-3">
                <button id="modal-add-btn" onclick="confirmAddToCart()" class="flex-1 btn-premium py-3.5 rounded-xl font-bold transition-all text-xs uppercase tracking-widest flex items-center justify-center gap-2">
                    <i data-lucide="shopping-cart" size="14"></i> Añadir al Pedido
                </button>
                <button onclick="closeModal('product-qty')" class="px-6 py-3.5 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 rounded-xl font-bold hover:bg-slate-200 dark:hover:bg-slate-750 transition-all text-xs cursor-pointer">
                    Cancelar
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Flotantes -->
<a href="https://wa.me/59178945612" target="_blank" rel="noopener" class="fixed bottom-8 right-8 z-[100] w-14 h-14 bg-emerald-500 text-white rounded-full shadow-2xl flex items-center justify-center hover:scale-110 active:scale-95 transition-all animate-enter-bottom" aria-label="Contactar por WhatsApp">
    <i data-lucide="message-circle" size="26"></i>
</a>

<!-- Barra de navegación inferior para dispositivos móviles (Estilo App Nativa) -->
<div id="mobile-bottom-nav" class="hidden lg:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-900 border-t border-slate-250 dark:border-slate-800 z-50 flex items-center justify-around py-2.5 px-4 shadow-[0_-10px_30px_rgba(0,0,0,0.08)] safe-bottom">
    <button onclick="navigate('catalog')" id="mobile-nav-catalog" class="mobile-tab-btn flex flex-col items-center gap-1 flex-1 text-slate-400 dark:text-slate-500 transition-all duration-200 cursor-pointer">
        <i data-lucide="layers" size="18"></i>
        <span class="text-[9px] font-bold tracking-tight">Catálogo</span>
    </button>
    <button onclick="navigate('dashboard')" id="mobile-nav-dashboard" class="mobile-tab-btn flex flex-col items-center gap-1 flex-1 text-slate-400 dark:text-slate-500 transition-all duration-200 cursor-pointer">
        <i data-lucide="bar-chart-3" size="18"></i>
        <span class="text-[9px] font-bold tracking-tight">Panel</span>
    </button>
    <button onclick="navigate('cart')" id="mobile-nav-cart" class="mobile-tab-btn flex flex-col items-center gap-1 flex-1 text-slate-400 dark:text-slate-500 relative transition-all duration-200 cursor-pointer">
        <i data-lucide="shopping-bag" size="18"></i>
        <span id="mobile-cart-badge" class="hidden absolute top-0.5 right-[28%] bg-blue-600 text-[8px] min-w-[15px] h-[15px] px-1 flex items-center justify-center rounded-full text-white font-bold shadow-lg shadow-blue-500/30">0</span>
        <span class="text-[9px] font-bold tracking-tight">Carrito</span>
    </button>
    <button onclick="navigate('orders-full')" id="mobile-nav-orders-full" class="mobile-tab-btn flex flex-col items-center gap-1 flex-1 text-slate-400 dark:text-slate-500 transition-all duration-200 cursor-pointer">
        <i data-lucide="clipboard-list" size="18"></i>
        <span class="text-[9px] font-bold tracking-tight">Órdenes</span>
    </button>
</div>

<div id="error-overlay" class="hidden fixed inset-0 z-[300] bg-slate-900 overflow-y-auto"></div>

<div id="toast" class="fixed bottom-8 right-8 z-[100] pointer-events-none">
    <div class="glass-toast text-slate-800 dark:text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 border border-white/40 dark:border-white/10">
        <div id="toast-icon" class="text-blue-500 dark:text-blue-400 flex-shrink-0 flex items-center justify-center"></div>
        <p id="toast-message" class="text-xs font-bold tracking-wide"></p>
    </div>
</div>

<script src="assets/js/app.js"></script>
<script src="assets/js/router.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });
</script>

</body>
</html>
