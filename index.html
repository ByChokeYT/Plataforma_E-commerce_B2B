<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Core | Plataforma de Suministros Industriales</title>
    <meta name="description" content="Portal corporativo B2B para pedidos al por mayor con precios dinámicos, gestión de crédito y dashboard estratégico.">
    <meta name="robots" content="noindex">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- ——— Design System CSS ——— -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

<div id="view-login" class="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900 overflow-hidden">
    <div class="absolute inset-0 z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-[var(--mesh-1)] rounded-full blur-[100px] animate-mesh"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-[var(--mesh-2)] rounded-full blur-[120px] animate-mesh" style="animation-delay: -5s;"></div>
        <div class="absolute top-[20%] right-[10%] w-[30%] h-[30%] bg-[var(--mesh-3)] rounded-full blur-[80px] animate-mesh" style="animation-delay: -10s;"></div>
    </div>

    <div class="glass w-full max-w-[420px] p-12 rounded-[2.5rem] relative z-10 mx-4 animate-enter-up border border-white/10 shadow-2xl backdrop-blur-3xl overflow-hidden">
        <!-- Efectos de brillo interno -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-blue-500/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-emerald-500/10 rounded-full blur-3xl"></div>

        <div class="relative z-10 text-center">
            <div class="w-20 h-20 bg-gradient-to-br from-blue-600 to-blue-400 rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-[0_0_40px_rgba(37,99,235,0.3)] transform rotate-3 hover:rotate-0 transition-transform duration-500">
                <i data-lucide="shield-check" class="text-white" size="36"></i>
            </div>
            
            <h2 class="text-4xl font-black text-white tracking-tighter mb-1">B2B Core</h2>
            <p class="text-[10px] text-blue-400 font-black uppercase tracking-[0.4em] mb-10">Premium Network Access</p>

            <div class="space-y-5 text-left">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-white/90 uppercase ml-1 tracking-widest">Identificador Corporativo</label>
                    <div class="relative group">
                        <i data-lucide="building-2" class="absolute left-5 top-1/2 -translate-y-1/2 text-white/40 group-focus-within:text-blue-400 transition-colors" size="18"></i>
                        <input type="text" id="login-user" placeholder="C-9901" 
                            class="w-full pl-14 pr-6 py-4 bg-white/5 border border-white/10 rounded-2xl focus:ring-8 focus:ring-blue-500/10 focus:border-blue-500/50 outline-none transition-all text-sm font-bold text-white placeholder:text-white/40">
                    </div>
                </div>
                
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-white/90 uppercase ml-1 tracking-widest">Código de Seguridad</label>
                    <div class="relative group">
                        <i data-lucide="lock" class="absolute left-5 top-1/2 -translate-y-1/2 text-white/40 group-focus-within:text-blue-400 transition-colors" size="18"></i>
                        <input type="password" id="login-pass" placeholder="••••••••" 
                            class="w-full pl-14 pr-6 py-4 bg-white/5 border border-white/10 rounded-2xl focus:ring-8 focus:ring-blue-500/10 focus:border-blue-500/50 outline-none transition-all text-sm font-bold text-white placeholder:text-white/40">
                    </div>
                </div>
            </div>

            <button onclick="handleLogin()" 
                class="w-full bg-gradient-to-r from-blue-600 to-blue-500 text-white py-4.5 rounded-2xl font-black text-xs uppercase tracking-widest hover:from-blue-500 hover:to-blue-400 hover:scale-[1.02] active:scale-[0.98] transition-all shadow-[0_10px_30px_rgba(37,99,235,0.3)] flex items-center justify-center gap-3 mt-10">
                Acceso Corporativo
                <i data-lucide="arrow-right" size="16"></i>
            </button>

            <div class="mt-10 pt-8 border-t border-white/10 flex flex-col gap-4">
                <p class="text-[9px] text-white/40 font-black uppercase text-center tracking-widest">Sistemas de Abastecimiento Certificados</p>
                <div class="flex justify-center gap-3">
                    <div class="px-4 py-2 bg-white/5 rounded-xl border border-white/5 text-[10px] font-bold text-white/40">C-9901</div>
                    <div class="px-4 py-2 bg-white/5 rounded-xl border border-white/5 text-[10px] font-bold text-white/40">C-8842</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="app-shell" class="hidden min-h-screen flex flex-col lg:flex-row bg-slate-50">
    <!-- Overlay para móvil -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>
    
    <div id="sidebar-slot"></div>
    
    <main class="flex-1 min-h-screen lg:pl-56 transition-all duration-500" id="main-content">
        <div class="p-4 md:p-8 lg:p-12 max-w-7xl mx-auto">
            <div id="header-slot"></div>
            <div id="page-slot" class="animate-enter-up"></div>
        </div>
    </main>
</div>

<!-- Modales Globales -->
<div id="modal-invoice" class="modal fixed inset-0 z-[110] flex items-center justify-center hidden">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeModal('invoice')"></div>
    <div class="bg-white w-full max-w-2xl mx-4 rounded-3xl shadow-2xl relative z-10 overflow-hidden animate-scale-in">
        <div id="invoice-content" class="p-12"></div>
        <div class="px-12 py-6 bg-slate-50 border-t border-slate-100 flex justify-end gap-4">
            <button onclick="closeModal('invoice')" class="px-6 py-2.5 text-xs font-bold text-slate-500 hover:text-slate-900 transition-colors">Cerrar</button>
            <button onclick="window.print()" class="px-6 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-bold hover:bg-blue-700 transition-all flex items-center gap-2">
                <i data-lucide="printer" size="14"></i> Imprimir Factura
            </button>
        </div>
    </div>
</div>

<div id="modal-tracking" class="modal fixed inset-0 z-[110] flex items-center justify-center hidden">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeModal('tracking')"></div>
    <div class="bg-white w-full max-w-lg mx-4 rounded-3xl shadow-2xl relative z-10 overflow-hidden animate-scale-in">
        <div class="p-8">
            <div class="flex justify-between items-start mb-8">
                <div>
                    <h3 class="text-lg font-bold text-slate-900" id="tracking-order-id">Rastreo de Orden</h3>
                    <p class="text-xs text-slate-400 mt-0.5" id="tracking-order-date"></p>
                </div>
                <button onclick="closeModal('tracking')" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center hover:bg-slate-200 transition-colors">
                    <i data-lucide="x" size="14"></i>
                </button>
            </div>
            <div id="tracking-timeline" class="relative"></div>
            <div class="mt-8 bg-slate-50 rounded-2xl p-5 flex items-center gap-4">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center flex-shrink-0">
                    <i data-lucide="truck" class="text-white" size="18"></i>
                </div>
                <div>
                    <p class="text-xs font-bold text-slate-900">Transportista: DHL Express Industrial</p>
                    <p class="text-[10px] text-slate-400 mt-0.5">Guía: <span class="font-mono font-bold text-blue-600" id="tracking-guide">—</span></p>
                </div>
            </div>
        </div>
        <div class="px-8 py-5 bg-slate-50 border-t border-slate-100 flex justify-end">
            <button onclick="closeModal('tracking')" class="px-6 py-2.5 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-slate-800 transition-all">Cerrar</button>
        </div>
    </div>
</div>

<div id="modal-bulk-import" class="modal fixed inset-0 z-[110] flex items-center justify-center hidden">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeModal('bulk-import')"></div>
    <div class="bg-white w-full max-w-md mx-4 rounded-3xl shadow-2xl relative z-10 overflow-hidden animate-scale-in">
        <div class="p-8">
            <h3 class="text-lg font-bold text-slate-900 mb-1">Carga Masiva de SKUs</h3>
            <p class="text-xs text-slate-400 mb-6">Pega los IDs y cantidades separados por coma.</p>
            <textarea id="bulk-input" placeholder="ID, CANTIDAD" class="w-full h-48 p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-mono focus:outline-none focus:ring-4 focus:ring-blue-500/5 focus:border-blue-500 transition-all mb-6 resize-none"></textarea>
            <div class="flex gap-3">
                <button onclick="handleBulkImport()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-all text-xs">Añadir al Carrito</button>
                <button onclick="closeModal('bulk-import')" class="px-6 py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 transition-all text-xs">Cancelar</button>
            </div>
        </div>
    </div>
</div>

<!-- Flotantes -->
<a href="https://wa.me/59178945612" target="_blank" rel="noopener" class="fixed bottom-8 right-8 z-[100] w-14 h-14 bg-emerald-500 text-white rounded-full shadow-2xl flex items-center justify-center hover:scale-110 active:scale-95 transition-all animate-enter-bottom" aria-label="Contactar por WhatsApp">
    <i data-lucide="message-circle" size="26"></i>
</a>

<div id="error-overlay" class="hidden fixed inset-0 z-[300] bg-slate-900 overflow-y-auto"></div>

<div id="toast" class="fixed bottom-8 right-8 z-[100]">
    <div class="bg-slate-900 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-4 border border-slate-700/50">
        <div id="toast-icon" class="text-blue-400"><i data-lucide="info" size="18"></i></div>
        <p id="toast-message" class="text-sm font-medium"></p>
    </div>
</div>

<script src="assets/js/app.js"></script>
<script src="assets/js/router.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });
</script>

</body>
</html>
